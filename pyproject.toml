[project]
name = "sheet"
version = "0.1.0"
description = "A simple spreadsheet with a parallel recalculation engine (Python 3.14t)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
ui = ["PyQt6>=6.7"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408"]
